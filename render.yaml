# MultiscaleNano on Render — ONE service, ONE public URL
# Dashboard → New → Blueprint → connect repo → Apply

services:
  - type: web
    name: multiscale
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: MULTISCALE_FORCE_FIELD
        value: martini3
      - key: MARTINI_FF_DIR
        value: /app/martini_ff
      - key: MULTISCALE_ARTIFACT_DIR
        value: /data/artifacts
      - key: MULTISCALE_API_URL
        value: http://127.0.0.1:8000
      - key: API_INTERNAL_URL
        value: http://127.0.0.1:8000
      - key: MULTISCALE_CORS_ORIGINS
        value: "*"
      - key: MULTISCALE_MD_PROFILE
        value: web
    disk:
      name: multiscale-data
      mountPath: /data
      sizeGB: 5
