[project]
name = "multiscale-core"
version = "0.1.0"
description = "Shared schemas and workflow engine for MultiscaleNano"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3"]
rdkit = ["rdkit>=2023.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multiscale_core"]
