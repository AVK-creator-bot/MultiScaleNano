# One command → one URL: http://localhost:3000
#   docker compose up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      MULTISCALE_ARTIFACT_DIR: /data/artifacts
      MULTISCALE_API_URL: http://127.0.0.1:8000
      API_INTERNAL_URL: http://127.0.0.1:8000
      PORT: "3000"
    volumes:
      - app_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  app_data:
